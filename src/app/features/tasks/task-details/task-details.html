<a routerLink="/tasks" class="back-link"><span><</span> Back to Tasks</a>

@if (!taskService.loaded()) {
  <app-spinner label="Loading task…" />
} @else if (task(); as t) {
  <app-card class="detail-card">
    <header>
      <div>
        <h1>{{ t.title }}</h1>
        <span class="status-chip" [class]="statusClass(t.status)">{{ t.status }}</span>
      </div>
      <app-task-actions [busy]="deleting()" (edit)="editTask()" (delete)="deleteTask()" />
    </header>

    <p class="deadline">
      <img class="calendar-icon" src="/images/calendar-circle.svg" alt="Deadline" />
      Due {{ t.deadline | date: 'dd-MM-yyyy' }}
    </p>

    <div class="description" [innerHTML]="t.description"></div>
  </app-card>
  <app-task-comments [taskId]="t.id"></app-task-comments>
} @else {
  <app-empty-state message="This task doesn't exist — it may have been deleted." />
}
