<div class="task-actions" [class.compact]="compact">
  <button 
    type="button" 
    class="btn" 
    [disabled]="busy" 
    (click)="onEdit($event)"
  >
    <img class="edit-icon" title="Edit" src="/images/edit.svg" alt="Edit task" />
  </button>
  <button
    type="button"
    class="btn btn-danger"
    [disabled]="busy"
    [attr.aria-label]="busy ? 'Deleting task…' : 'Delete task'"
    (click)="onDelete($event)"
  >
    @if (busy) {
      <app-spinner size="sm" [inline]="true" />
    } @else {
      <img class="delete-icon" title="Delete" src="/images/delete.svg" alt="Delete task" />
    }
  </button>
</div>
